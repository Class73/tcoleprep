<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCOLE Practice Exam</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
    background:#121212;
    color:#e0e0e0;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    background:#333;
    color:white;
    border:1px solid #555;
}

.question{
    border:1px solid #444;
    border-radius:6px;
    padding:15px;
    margin-bottom:15px;
    background:#1e1e1e;
}

.correct{
    background:#1b3a1b;
    border-color:#4caf50;
    color:#e0e0e0;
}

.incorrect{
    background:#3a1b1b;
    border-color:#f44336;
    color:#e0e0e0;
}

.review-item{
    border:1px solid #444;
    padding:12px;
    margin-bottom:10px;
    background:#1e1e1e;
}

#score{
    margin-top:20px;
}
</style>
</head>
<body>

<h1>TCOLE Practice Exam</h1>

<div>
    <button onclick="startExam(5)">5 Questions</button>
    <button onclick="startExam(25)">25 Questions</button>
    <button onclick="startExam(250)">250 Questions</button>
    <button onclick="startExam(masterBank.length)">Full Bank</button>
    <button onclick="gradeQuiz()">Grade Me</button>
</div>

<hr>

<div id="score"></div>

<div id="quizContainer"></div>

<script src="master-bank.js"></script>
<script src="quiz-engine.js"></script>

</body>
</html>
