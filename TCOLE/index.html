<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCOLE Practice Exam</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

.question{
    border:1px solid #ccc;
    border-radius:6px;
    padding:15px;
    margin-bottom:15px;
}

.correct{
    background:#e8ffe8;
    border-color:green;
}

.incorrect{
    background:#fff0f0;
    border-color:red;
}

.review-item{
    border:1px solid #ddd;
    padding:12px;
    margin-bottom:10px;
}

#score{
    margin-top:20px;
}
</style>
</head>
<body>

<h1>TCOLE Practice Exam</h1>

<div>
    <button onclick="startExam(25)">25 Questions</button>
    <button onclick="startExam(50)">50 Questions</button>
    <button onclick="startExam(100)">100 Questions</button>
    <button onclick="startExam(masterBank.length)">Full Bank</button>
    <button onclick="gradeQuiz()">Grade Me</button>
</div>

<hr>

<div id="score"></div>

<div id="quizContainer"></div>

<script src="master-bank.js"></script>
<script src="quiz-engine.js"></script>

</body>
</html>
