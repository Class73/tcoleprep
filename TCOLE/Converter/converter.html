<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TCOLE DOCX Converter</title>

<script src="https://unpkg.com/mammoth/mr.min.jsscript>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}

textarea{
    width:100%;
    height:400px;
}

#output{
    height:600px;
}
</style>
</head>

<body>

<h1>TCOLE DOCX Converter</h1>

<input type="file" id="docxFile" accept=".docx">

<button onclick="loadDocx()">
Convert DOCX
</button>

<h3>Output</h3>

<textarea id="output"></textarea>

<script>

async function loadDocx(){

    const file =
        document.getElementById("docxFile")
        .files[0];

    if(!file){
        alert("Select a DOCX file.");
        return;
    }

    const arrayBuffer =
        await file.arrayBuffer();

    const result =
        await mammoth.convertToHtml({
            arrayBuffer
        });

    convertQuestions(result.value);

}

function convertQuestions(html){

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    const text =
        doc.body.innerHTML;

    const blocks =
        text.split(/(?=\d+\.)/);

    let questions = [];

    blocks.forEach(block=>{

        block = block.trim();

        if(!block) return;

        let answer = "";

        if(block.match(/<strong[^>]*>\s*A\./i)) answer="A";
        if(block.match(/<strong[^>]*>\s*B\./i)) answer="B";
        if(block.match(/<strong[^>]*>\s*C\./i)) answer="C";
        if(block.match(/<strong[^>]*>\s*D\./i)) answer="D";

        const plain =
            block
            .replace(/<[^>]+>/g," ")
            .replace(/\s+/g," ")
            .trim();

        const q =
            plain.match(
                /^\d+\.\s*(.*?)\s*A\./
            );

        if(!q) return;

        const a =
            plain.match(
                /A\.\s*(.*?)\s*B\./
            );

        const b =
            plain.match(
                /B\.\s*(.*?)\s*C\./
            );

        const c =
            plain.match(
                /C\.\s*(.*?)\s*D\./
            );

        const d =
            plain.match(
                /D\.\s*(.*)$/
            );

        questions.push(`{
    id: "TCOLE_${String(
        questions.length + 1
    ).padStart(4,"0")}",

    prompt: "${q[1]
        .replace(/"/g,'\\"')}",

    options: [
        { id: "A", text: "${a ? a[1].replace(/"/g,'\\"') : ""}" },
        { id: "B", text: "${b ? b[1].replace(/"/g,'\\"') : ""}" },
        { id: "C", text: "${c ? c[1].replace(/"/g,'\\"') : ""}" },
        { id: "D", text: "${d ? d[1].replace(/"/g,'\\"') : ""}" }
    ],

    answer: "${answer}"
},`);

    });

    document
        .getElementById("output")
        .value =
        questions.join("\n\n");
}

</script>

</body>
</html>
